<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brumaluz • Prototipo de Pesca Cozy (Independiente)</title>
  <link rel="stylesheet" href="./styles/fishing.css">
  <style>
    /* Estilos del inspector de integración para desarrollo */
    .integration-event-dock {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      font-family: monospace;
    }
    .dock-toggle {
      background: #1a1008;
      border: 1.5px solid #c99142;
      color: #ffe2a0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
    }
    .dock-content {
      margin-top: 6px;
      width: 360px;
      height: 180px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #38bdf8;
      border-radius: 8px;
      padding: 10px;
      color: #cbd5e1;
      font-size: 11px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .log-line {
      margin-bottom: 4px;
      border-bottom: 1px dotted #334155;
      padding-bottom: 2px;
    }
    .log-line.event-catch { color: #4ade80; font-weight: bold; }
    .log-line.event-escape { color: #f87171; }
    .log-line.event-phase { color: #38bdf8; }
  </style>
</head>
<body class="fishing-demo-body">

  <main id="fishing-root"></main>

  <!-- Inspector de Eventos del Contrato de Integración -->
  <aside class="integration-event-dock">
    <button id="btn-toggle-event-dock" class="dock-toggle">📜 Inspector de Eventos API</button>
    <div id="event-dock-content" class="dock-content" hidden>
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px solid #475569; padding-bottom: 4px;">
        <span style="color: #38bdf8; font-weight: bold;">Salida de Eventos MMORPG:</span>
        <button id="btn-clear-dock" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 10px;">Limpiar</button>
      </div>
      <div id="event-log-container">
        <div class="log-line">Esperando inicio de sesión...</div>
      </div>
    </div>
  </aside>

  <script type="module">
    import { FishingMinigameController } from './src/api/fishing-api.js';

    const rootEl = document.getElementById('fishing-root');
    const logContainer = document.getElementById('event-log-container');
    const dockBtn = document.getElementById('btn-toggle-event-dock');
    const dockContent = document.getElementById('event-dock-content');
    const clearBtn = document.getElementById('btn-clear-dock');

    // Inicializar el minijuego de pesca
    const fishingGame = FishingMinigameController.launch(rootEl, {
      zoneId: 'rio_brumaluz',
      rodId: 'cana_sauce',
      baitId: 'sin_cebo',
      accessibleMode: false
    });

    // Logging de eventos para probar la integración
    function logEvent(type, payload, cls = '') {
      const line = document.createElement('div');
      line.className = `log-line ${cls}`;
      const time = new Date().toLocaleTimeString();
      line.textContent = `[${time}] ${type}: ${JSON.stringify(payload)}`;
      logContainer.prepend(line);
    }

    fishingGame.on('phaseChange', (phase) => logEvent('Fase', phase, 'event-phase'));
    fishingGame.on('bite', () => logEvent('Picada', '¡Pez mordió el anzuelo!', 'event-phase'));
    fishingGame.on('catch', (res) => logEvent('CAPTURA ÉXITO', {
      especie: res.species?.name,
      longitud_cm: res.size,
      peso_kg: res.weight,
      calidad: res.quality,
      precision: res.reelingAccuracy,
      firma: res.clientSignature
    }, 'event-catch'));
    fishingGame.on('escape', (res) => logEvent('ESCAPE', { especie: res.species?.name }, 'event-escape'));
    fishingGame.on('cancel', () => logEvent('Sesión Cancelada', null));

    // Control del inspector
    dockBtn.addEventListener('click', () => {
      dockContent.hidden = !dockContent.hidden;
    });
    clearBtn.addEventListener('click', () => {
      logContainer.innerHTML = '';
    });
  </script>
</body>
</html>
