  <style>
    .cloud { animation: cloud-drift 46s ease-in-out infinite alternate; }
    .cloud.far { animation-duration: 68s; animation-direction: alternate-reverse; }
    .star { animation: star-glint 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .star.slow { animation-delay: -2.1s; animation-duration: 5.2s; }
    .lamp-halo { animation: lantern-breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .lamp-halo.second { animation-delay: -1.6s; }
    .firefly { animation: firefly-drift 7s ease-in-out infinite; }
    .firefly.f2 { animation-delay: -2.5s; animation-duration: 8.5s; }
    .firefly.f3 { animation-delay: -4.7s; animation-duration: 6.5s; }
    .flag { animation: flag-sway 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes cloud-drift { from { transform: translateX(-9px); } to { transform: translateX(13px); } }
    @keyframes star-glint { 0%, 100% { opacity: .38; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes lantern-breathe { 0%, 100% { opacity: .58; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes firefly-drift { 0%, 100% { opacity: .15; transform: translate(0, 4px); } 30% { opacity: .95; } 55% { transform: translate(9px, -11px); } 75% { opacity: .5; } }
    @keyframes flag-sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
